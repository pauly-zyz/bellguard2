name: Website

# Publishes web/ to GitHub Pages. Pages is not enabled yet, so this runs only by hand.
# To go live: Settings -> Pages -> Source: GitHub Actions (private repos need a paid plan,
# and the site is public), then run this workflow from the Actions tab. To deploy on every
# push afterwards, add:  push: { branches: [main], paths: ["web/**"] }
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
