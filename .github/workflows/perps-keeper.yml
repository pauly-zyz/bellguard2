name: Perps keeper (Elysium)

# Mirrors Chainlink stock prices to Bellguard Perps on Elysium, liquidates unsafe
# positions and trims leverage before the market closes. Runs only once the perps
# deployment file exists. Needs the secret PERPS_KEEPER_KEY (the feed updater wallet).
# Each run keeps working for ~5h45m (a pass every 2 minutes); the hourly schedule starts the next
# one, which waits in the queue until the current run ends. GitHub often delays or skips
# frequent schedules, so this keeps prices fresh even when a scheduled start is late.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

concurrency:
  group: perps-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment
        id: dep
        run: test -f ../contracts/deployments/perps-99901.json && echo "ok=1" >> "$GITHUB_OUTPUT" || echo "Perps not deployed yet; nothing to do."
      - uses: actions/setup-node@v4
        if: steps.dep.outputs.ok == '1'
        with:
          node-version: 22
      - if: steps.dep.outputs.ok == '1'
        run: npm install --no-audit --no-fund
      - name: Run keeper
        if: steps.dep.outputs.ok == '1'
        env:
          PERPS_KEEPER_KEY: ${{ secrets.PERPS_KEEPER_KEY }}
          PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
          DRY_RUN: ${{ secrets.PERPS_KEEPER_KEY == '' && '1' || '0' }}
          LOOP_MINUTES: "345"
          INTERVAL_SECONDS: "120"
        run: npm run perps
