<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;1,6..96,600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}
#b{position:relative;width:1500px;height:500px;overflow:hidden;font-family:"IBM Plex Mono",monospace;color:#e9edf3;
 background:radial-gradient(700px 380px at 78% 30%,rgba(226,176,82,.22),transparent 65%),radial-gradient(600px 300px at 0% 100%,rgba(79,210,154,.10),transparent 60%),linear-gradient(180deg,#0d1422,#080c15);}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);background-size:50px 50px}
#left{position:absolute;left:90px;top:70px;width:900px}
.eyebrow{display:flex;align-items:center;gap:14px;color:#e2b052;font-size:19px;letter-spacing:.2em;font-weight:600}
.eyebrow:before{content:"";width:34px;height:2px;background:#e2b052}
h1{font-family:"Bodoni Moda",serif;font-weight:700;font-size:118px;line-height:1;margin:22px 0 0;letter-spacing:-.01em;display:flex;align-items:center;gap:26px}
h1 svg{width:104px;height:104px;transform-origin:50% 8%}
.tag{font-family:"Bodoni Moda",serif;font-size:38px;white-space:nowrap;margin-top:20px;color:#cfd6e2}
.tag em{color:#e2b052}
#pill{position:absolute;right:120px;top:52px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;font-weight:600;font-size:17px;letter-spacing:.12em;color:#ff7d61;border:1.5px solid rgba(255,125,97,.5);background:rgba(255,125,97,.1)}
.pill i{width:10px;height:10px;border-radius:50%;background:#ff7d61}
#dial{position:absolute;right:120px;top:108px;width:290px;height:290px}
#dial .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.lab{font-size:15px;letter-spacing:.18em;color:#94a3b8}
.big{font-family:"Bodoni Moda",serif;font-size:52px;font-weight:700;color:#e2b052;line-height:1.1}
#tape{position:absolute;left:0;right:0;bottom:0;height:62px;border-top:1px solid #22314a;background:rgba(9,14,24,.85);overflow:hidden}
#tin{display:flex;position:absolute;top:0;left:0}
.ti{flex:none;width:300px;height:62px;display:flex;align-items:center;justify-content:center;gap:12px;border-right:1px solid #22314a;font-size:19px;white-space:nowrap}
.ti b{font-weight:600}.g{color:#4fd29a}.r{color:#ff7d61}.m{color:#94a3b8}.y{color:#e2b052}
</style></head><body>
<div id="b"><div id="grid"></div>
 <div id="left">
  <div class="eyebrow">ROBINHOOD CHAIN · UNISWAP V4 HOOK</div>
  <h1><svg id="bell" viewBox="0 0 32 32"><defs><linearGradient id="br" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#fbe3a6"/><stop offset=".45" stop-color="#e2b052"/><stop offset="1" stop-color="#9c6a14"/></linearGradient></defs>
   <path d="M16 3.4c-4.6 0-7.4 3.6-7.4 8.4v5.2c0 2.6-2.2 4.2-4 5.4v1.4h22.8v-1.4c-1.8-1.2-4-2.8-4-5.4v-5.2c0-4.8-2.8-8.4-7.4-8.4z" fill="url(#br)"/><circle id="clap" cx="16" cy="26.8" r="2.5" fill="url(#br)"/><circle cx="16" cy="2.6" r="1.3" fill="url(#br)"/></svg>Bellguard <span style="font-family:'IBM Plex Mono';font-size:40px;color:#e2b052;font-weight:600;align-self:flex-end;margin-bottom:18px">$BLGD</span></h1>
  <div class="tag">Your liquidity, covered until the <em>opening bell</em>.</div>
 </div>
 <div id="pill"><span class="pill"><i id="dot"></i>WEEKEND GAP COVER</span></div>
 <div id="dial"><svg viewBox="0 0 120 120" width="290" height="290">
   <circle cx="60" cy="60" r="52" fill="none" stroke="#22314a" stroke-width="7"/>
   <circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#4fd29a" stroke-width="7" stroke-linecap="round" pathLength="100" stroke-dasharray="62 38"/>
   <circle id="arc2" cx="60" cy="60" r="52" fill="none" stroke="#ff7d61" stroke-width="7" stroke-linecap="round" pathLength="100" stroke-dasharray="26 74" stroke-dashoffset="-68"/>
   <circle id="tick" cx="60" cy="8" r="4.2" fill="#f5d48e"/>
  </svg><div class="c"><div><div class="lab">LP COVER</div><div class="big">5%</div><div class="lab">PER WINDOW</div></div></div></div>
 <div id="tape"><div id="tin"></div></div>
</div>
<script>
const items=["<b>COIN/USDG</b><span class=g>● COVERED</span>","<b>MSTR/USDG</b><span class=g>● COVERED</span>","<span class=m>PREMIUM</span><b class=y>0.10%</b>","<span class=m>MARKET</span><b class=r>CLOSED ▼</b>","<span class=m>VAULT</span><b>bgUSDG</b>","<span class=m>SETTLE</span><b>CHAINLINK</b>"];
const tin=document.getElementById('tin');
tin.innerHTML=[...items,...items,...items].map(h=>"<div class=ti>"+h+"</div>").join("");
window.render=function(t){ // t in [0,1)
  const TW=2*Math.PI*t;
  document.getElementById('bell').style.transform="rotate("+(14*Math.sin(TW*2)*Math.exp(-0)) +"deg)";
  document.getElementById('clap').setAttribute('cx',16+1.6*Math.sin(TW*2-0.6));
  const rot=360*t;
  for(const id of ['arc','arc2']) document.getElementById(id).setAttribute('transform','rotate('+(rot-90)+' 60 60)');
  document.getElementById('tick').setAttribute('transform','rotate('+rot+' 60 60)');
  tin.style.transform="translateX("+(-1800*t)+"px)";
  document.getElementById('dot').style.opacity=(0.35+0.65*(0.5+0.5*Math.cos(TW*4))).toFixed(2);
};
render(0);
</script></body></html>
